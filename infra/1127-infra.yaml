AWSTemplateFormatVersion: "2010-09-09"
Description: >
  1127 Events — data and identity for the marketing site and admin dashboard.
  Creates two DynamoDB tables, a Cognito user pool for staff sign-in, and an
  IAM policy to attach to the Amplify Hosting compute role.

  The stack name must begin with a letter (CloudFormation constraint), which
  is why it is events-1127 rather than 1127-events. ProjectName below is
  unconstrained, so the resources themselves keep the 1127-events prefix.

  Deploy with:
    aws cloudformation deploy \
      --template-file infra/1127-infra.yaml \
      --stack-name events-1127 \
      --capabilities CAPABILITY_IAM \
      --region us-west-2

Parameters:
  ProjectName:
    Type: String
    Default: 1127-events
    Description: Prefix for all resource names.

  AdminEmail:
    Type: String
    Default: ""
    Description: >
      Optional. If set, this email is created as the first admin user and AWS
      emails them a temporary password. Leave blank to create users by hand.

  SiteDomain:
    Type: String
    Default: 1127.events
    Description: >
      Public site domain, without a scheme. Used for the CORS allow-list on the
      images bucket so the dashboard can upload directly to S3.

  SendingDomain:
    Type: String
    Default: ""
    Description: >
      Optional. Domain SES will send RSVP email from, e.g. 1127events.com.
      Creates a verified identity with DKIM; you then add the three CNAME
      records from the stack outputs to DNS. Leave blank to skip email setup.

Conditions:
  CreateAdminUser: !Not [!Equals [!Ref AdminEmail, ""]]
  CreateEmailIdentity: !Not [!Equals [!Ref SendingDomain, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # Data
  # ---------------------------------------------------------------------------

  EventsTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-events"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-submissions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: type
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Lets the dashboard read one submission type newest-first without
        # scanning the whole table.
        - IndexName: byType
          KeySchema:
            - AttributeName: type
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # Rate limiting
  # ---------------------------------------------------------------------------

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    # Deliberately NOT Retain. This table holds only short-lived counters, and a
    # stale one left behind after a stack delete would be worse than useless.
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub "${ProjectName}-ratelimit"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      # DynamoDB deletes expired rows for us, so old windows cost nothing and
      # need no sweeper. Expiry is best-effort (up to ~48h late), which is fine:
      # the window logic ignores timestamps outside the window regardless.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # Images — event photography, swappable without a deploy
  # ---------------------------------------------------------------------------

  ImagesBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      # Bucket names are globally unique, so the account id keeps this from
      # colliding with someone else's.
      BucketName: !Sub "${ProjectName}-images-${AWS::AccountId}"
      OwnershipControls:
        # ACLs disabled. Access is granted by bucket policy only, which is one
        # mechanism to reason about instead of two.
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        # Public *reads* are the point: these are marketing photographs.
        # Everything else stays blocked, so nobody can make the bucket writable
        # or listable by accident.
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        # Needed so the dashboard can PUT straight to S3 with a presigned URL
        # rather than routing image bytes through the app.
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins:
              - !Sub "https://${SiteDomain}"
              - !Sub "https://www.${SiteDomain}"
              - http://localhost:3000
            AllowedHeaders: ["*"]
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Read-only, and only for objects. Listing the bucket is not granted,
          # so the set of filenames is not enumerable by the public.
          - Sid: PublicReadObjects
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ImagesBucket.Arn}/*"

  # ---------------------------------------------------------------------------
  # Identity — staff sign-in for /admin
  # ---------------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-admins"
      # Staff accounts are created by an administrator; there is no public
      # sign-up for the dashboard.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "Your 1127 Events admin account"
          EmailMessage: >
            You have been added to the 1127 Events dashboard.
            Username: {username}
            Temporary password: {####}
            You'll be asked to choose a new password when you first sign in.
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # Send login codes through SES rather than Cognito's built-in sender.
      #
      # Two reasons this matters more than it looks. Cognito's default sender is
      # capped at 50 emails per day across the whole pool, and a login code that
      # silently does not arrive is indistinguishable from a broken dashboard.
      # It also sends from an amazonaws.com address, which lands in spam more
      # often than a DKIM-signed message from our own verified domain.
      #
      # Note this keeps working while SES is in the sandbox: every admin address
      # is at the verified domain, so codes are deliverable today.
      EmailConfiguration: !If
        - CreateEmailIdentity
        - EmailSendingAccount: DEVELOPER
          From: !Sub "1127 Events <hello@${SendingDomain}>"
          SourceArn: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SendingDomain}"
        - !Ref AWS::NoValue
      # Passwordless. Staff sign in with a code emailed to them, so there is no
      # admin password to phish, reuse, or leak. Requires the ESSENTIALS feature
      # plan, which this pool is on.
      #
      # PASSWORD is listed because Cognito refuses the pool otherwise:
      #   "PASSWORD should be configured as one of the allowed first auth
      #    factors."
      # It cannot be removed. So passwordless is enforced in two other layers
      # instead, and both matter:
      #
      #   1. The app client below does NOT grant ALLOW_USER_PASSWORD_AUTH, so
      #      there is no API path that accepts a password directly.
      #   2. Accounts are created with a random permanent password that is
      #      generated, used once to move the account to CONFIRMED, and then
      #      discarded unrecorded. Nobody knows it, so nobody can present it.
      #
      # Neither layer alone would be enough. Together, the emailed code is the
      # only usable way in.
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
            - EMAIL_OTP
        # Still declared because Cognito requires a password on user creation
        # even when passwords are never used to sign in.
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      # MFA off by design: the emailed code IS the factor. Requiring a second
      # one on top would be theatre for a three-person dashboard.
      MfaConfiguration: "OFF"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: !Ref ProjectName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-admin-web"
      UserPoolId: !Ref UserPool
      # No client secret: the app authenticates server-side and stores the
      # resulting access token in an HTTP-only cookie.
      GenerateSecret: false
      ExplicitAuthFlows:
        # ALLOW_USER_AUTH is the choice-based flow that carries EMAIL_OTP.
        # ALLOW_USER_PASSWORD_AUTH is deliberately absent: with it enabled, a
        # caller could bypass the emailed code entirely and sign in with a
        # password, which would quietly undo the passwordless decision.
        - ALLOW_USER_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 8
      IdTokenValidity: 8
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  FirstAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: CreateAdminUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: "true"

  # ---------------------------------------------------------------------------
  # Email — RSVP confirmations and internal notifications
  # ---------------------------------------------------------------------------

  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: CreateEmailIdentity
    Properties:
      EmailIdentity: !Ref SendingDomain
      DkimAttributes:
        SigningEnabled: true
      MailFromAttributes:
        # A custom MAIL FROM domain aligns SPF with the From: address, which
        # materially improves inbox placement.
        MailFromDomain: !Sub "mail.${SendingDomain}"
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  EmailConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub "${ProjectName}-email"
      ReputationOptions:
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: true
      SuppressionOptions:
        # Stop sending to addresses that hard-bounce or report spam.
        SuppressedReasons:
          - BOUNCE
          - COMPLAINT

  # ---------------------------------------------------------------------------
  # Permissions for the Amplify Hosting compute role
  # ---------------------------------------------------------------------------

  AppDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-app-data"
      Description: Read/write access to the 1127 Events tables, plus SES and SMS send.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventsAndSubmissions
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !GetAtt EventsTable.Arn
              - !GetAtt SubmissionsTable.Arn
              - !Sub "${SubmissionsTable.Arn}/index/*"
              - !GetAtt RateLimitTable.Arn
          - Sid: UploadImages
            Effect: Allow
            Action:
              # PutObject so the dashboard can hand out presigned upload URLs.
              # No DeleteObject: replacing a photograph means overwriting a key,
              # and not granting deletion means a misdirected call cannot wipe
              # the gallery.
              - s3:PutObject
            Resource: !Sub "${ImagesBucket.Arn}/*"
          - Sid: SendSms
            Effect: Allow
            Action:
              - sms-voice:SendTextMessage
            # Scoped to the account's own origination identities. Phone numbers
            # are provisioned through the console because A2P registration is a
            # manual review process, so there is no ARN to reference here.
            Resource: !Sub "arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:*"

          # Only added when a sending domain was supplied, and scoped to that
          # identity so this role can't send as anything else.
          - !If
            - CreateEmailIdentity
            - Sid: SendRsvpEmail
              Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SendingDomain}"
                - !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ProjectName}-email"
            - !Ref AWS::NoValue

Outputs:
  EventsTableName:
    Description: Set as EVENTS_TABLE in Amplify.
    Value: !Ref EventsTable

  SubmissionsTableName:
    Description: Set as SUBMISSIONS_TABLE in Amplify.
    Value: !Ref SubmissionsTable

  RateLimitTableName:
    Description: Set as RATELIMIT_TABLE in Amplify.
    Value: !Ref RateLimitTable

  ImagesBucketName:
    Description: Set as IMAGES_BUCKET in Amplify.
    Value: !Ref ImagesBucket

  ImagesBaseUrl:
    Description: >
      Set as IMAGES_BASE_URL in Amplify, and add this host to
      next.config.ts images.remotePatterns or Next will refuse to render them.
    Value: !Sub "https://${ImagesBucket}.s3.${AWS::Region}.amazonaws.com"

  CognitoUserPoolId:
    Description: Set as COGNITO_USER_POOL_ID in Amplify.
    Value: !Ref UserPool

  CognitoClientId:
    Description: Set as COGNITO_CLIENT_ID in Amplify.
    Value: !Ref UserPoolClient

  AppDataPolicyArn:
    Description: Attach this policy to the Amplify app's compute (SSR) IAM role.
    Value: !Ref AppDataPolicy

  Region:
    Description: Set as APP_AWS_REGION in Amplify.
    Value: !Ref AWS::Region

  EmailConfigurationSetName:
    Description: Set as SES_CONFIGURATION_SET in Amplify.
    Value: !Ref EmailConfigurationSet

  DkimRecord1:
    Condition: CreateEmailIdentity
    Description: Add as a CNAME record in DNS (name -> value).
    Value: !Sub "${EmailIdentity.DkimDNSTokenName1} -> ${EmailIdentity.DkimDNSTokenValue1}"

  DkimRecord2:
    Condition: CreateEmailIdentity
    Description: Add as a CNAME record in DNS (name -> value).
    Value: !Sub "${EmailIdentity.DkimDNSTokenName2} -> ${EmailIdentity.DkimDNSTokenValue2}"

  DkimRecord3:
    Condition: CreateEmailIdentity
    Description: Add as a CNAME record in DNS (name -> value).
    Value: !Sub "${EmailIdentity.DkimDNSTokenName3} -> ${EmailIdentity.DkimDNSTokenValue3}"

  MailFromMxRecord:
    Condition: CreateEmailIdentity
    Description: >
      Add as an MX record on the MAIL FROM subdomain, priority 10.
    Value: !Sub "mail.${SendingDomain} -> feedback-smtp.${AWS::Region}.amazonses.com"

  MailFromTxtRecord:
    Condition: CreateEmailIdentity
    Description: Add as a TXT record on the MAIL FROM subdomain.
    Value: !Sub 'mail.${SendingDomain} -> "v=spf1 include:amazonses.com ~all"'
